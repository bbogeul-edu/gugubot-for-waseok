<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>구구봇</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Orbitron:wght@600;800&display=swap">
<style>
/* 레이아웃: 화면 가운데 큰 로봇, 오른쪽 말풍선(문제·정답), 아래 조작 막대. 교실 TV/프로젝터용 밝은 단일 테마 */
:root{
  --bg:#e7f0f5; --grid:#d3e2ea; --ink:#1c2e3d; --muted:#5b7183;
  --metal:#c3d2dc; --metal-dark:#8fa5b5; --screen:#132331;
  --glow:#45e9ff; --led:#7dff9b; --accent:#ff8a3d; --danger:#ff5468;
  --card:#ffffff;
  --f-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-digit:"Orbitron","Jua",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--ink);font-family:var(--f-display);
  display:flex;flex-direction:column;padding:16px;gap:12px;overflow-x:hidden;
}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(28px,4vw,44px);letter-spacing:.02em;font-weight:400}
h1 span{color:var(--accent)}
.status-pill{font-size:18px;padding:6px 16px;border-radius:999px;background:var(--card);border:2px solid var(--metal-dark);display:flex;align-items:center;gap:8px}
.status-pill i{width:12px;height:12px;border-radius:50%;background:var(--metal-dark);display:inline-block}
body[data-state="listening"] .status-pill i{background:var(--danger);animation:pulse 1s infinite}
body[data-state="thinking"] .status-pill i{background:var(--accent);animation:pulse .4s infinite}
body[data-state="answering"] .status-pill i{background:#2fbf60}

main{flex:1;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:center;min-height:0}
@media (max-width:820px){main{grid-template-columns:1fr}}

/* ---------- 로봇 ---------- */
.robot-wrap{display:flex;justify-content:center;min-width:0}
svg.robot{width:min(100%,520px);height:auto;max-height:72vh;overflow:visible}
svg .g{transform-box:fill-box;transform-origin:center}
#head{transform-origin:200px 230px;transform-box:view-box}
body[data-state="thinking"] #head{animation:wobble 1.1s ease-in-out infinite}
body[data-state="answering"] #head{animation:nod .5s ease-in-out 2}
body[data-state="error"] #head{animation:shake .12s linear 5}

#antennaLight{fill:var(--accent)}
body[data-state="listening"] #antennaLight{fill:var(--danger);animation:blink 1s infinite}
body[data-state="thinking"] #antennaLight{fill:#ffd23d;animation:blink .25s infinite}
body[data-state="answering"] #antennaLight{fill:var(--led)}

.ear{fill:var(--metal-dark);transition:fill .2s}
body[data-state="listening"] .ear{fill:var(--danger);animation:earPulse 1s infinite}

/* 눈 */
.eye-normal,.eye-think,.eye-happy,.eye-x{display:none}
body[data-state="idle"] .eye-normal,body[data-state="listening"] .eye-normal{display:inline}
body[data-state="thinking"] .eye-think{display:inline}
body[data-state="answering"] .eye-happy{display:inline}
body[data-state="error"] .eye-x{display:inline}
.eye-normal{fill:var(--glow);animation:eyeBlink 4s infinite}
body[data-state="listening"] .eye-normal{animation:eyeBig 1s ease-in-out infinite}
.eye-think{fill:none;stroke:var(--glow);stroke-width:6;stroke-linecap:round;stroke-dasharray:50 40;animation:spin .7s linear infinite}
.eye-think.r{animation-direction:reverse}
.eye-happy,.eye-x{fill:none;stroke:var(--glow);stroke-width:7;stroke-linecap:round}
.eye-x{stroke:var(--danger)}

/* 입 LED */
.bar{fill:var(--led);transform-box:fill-box;transform-origin:center;transform:scaleY(.25)}
body[data-state="listening"] .bar{animation:listenBar 1.2s ease-in-out infinite}
body[data-state="thinking"] .bar{fill:#ffd23d;animation:scan .7s ease-in-out infinite}
body.speaking .bar{animation:talk .28s ease-in-out infinite alternate}
.bar:nth-child(2){animation-delay:.08s}.bar:nth-child(3){animation-delay:.16s}
.bar:nth-child(4){animation-delay:.24s}.bar:nth-child(5){animation-delay:.32s}
.bar:nth-child(6){animation-delay:.40s}.bar:nth-child(7){animation-delay:.48s}

/* 톱니 */
.gear{fill:none;stroke:var(--metal-dark);stroke-width:12;stroke-dasharray:7 6;opacity:.0;transition:opacity .3s}
.gear-hub{fill:var(--metal-dark);opacity:0;transition:opacity .3s}
body[data-state="thinking"] .gear,body[data-state="thinking"] .gear-hub{opacity:1}
body[data-state="thinking"] .gear{animation:spin 1.6s linear infinite}
body[data-state="thinking"] .gear.r{animation:spin 1.1s linear infinite reverse}

/* 팔 */
#armL{transform-origin:118px 285px;transform-box:view-box}
#armR{transform-origin:282px 285px;transform-box:view-box}
body[data-state="answering"] #armR{animation:wave .45s ease-in-out infinite alternate}
body[data-state="thinking"] #armL{animation:scratch .5s ease-in-out infinite alternate}

#chestText{font-family:var(--f-digit);font-weight:800;fill:var(--led)}
#chestBar{fill:#ffd23d}

/* ---------- 말풍선 ---------- */
.panel{display:flex;flex-direction:column;gap:16px;min-width:0}
.bubble{background:var(--card);border:3px solid var(--ink);border-radius:28px;padding:24px 28px;box-shadow:6px 6px 0 var(--ink);position:relative}
.label{font-size:18px;color:var(--muted);letter-spacing:.06em}
.problem{font-family:var(--f-digit);font-weight:800;font-size:clamp(48px,7vw,96px);line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.problem .q{color:var(--accent)}
.problem .ans{color:#14a34a;display:inline-block}
body[data-state="answering"] .problem .ans{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.heard{font-size:20px;color:var(--muted);min-height:1.5em;overflow-wrap:anywhere}
.heard b{color:var(--ink);font-weight:400}
.msg{font-size:22px;min-height:1.4em}
.msg.err{color:var(--danger)}

/* ---------- 조작 막대 ---------- */
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
button,select,input{font-family:var(--f-display);font-size:20px}
button{cursor:pointer;border:3px solid var(--ink);border-radius:16px;padding:10px 18px;background:var(--card);color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid var(--glow);outline-offset:2px}
#micBtn{background:var(--accent);color:#fff;font-size:24px;padding:12px 26px}
body[data-listening="on"] #micBtn{background:var(--danger)}
.manual{display:flex;gap:8px;flex:1;min-width:240px}
.manual input{flex:1;min-width:0;border:3px solid var(--ink);border-radius:16px;padding:10px 14px;background:var(--card);color:var(--ink)}
details{background:var(--card);border:2px solid var(--metal-dark);border-radius:16px;padding:8px 14px;font-size:18px}
details summary{cursor:pointer}
.settings{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 14px;align-items:center;padding-top:10px}
.settings select{max-width:100%;font-size:16px;padding:4px}
.settings input[type=range]{width:100%}
.hint{font-size:16px;color:var(--muted)}

@keyframes pulse{50%{opacity:.3}}
@keyframes blink{50%{opacity:.2}}
@keyframes earPulse{50%{fill:#ffb1bb}}
@keyframes eyeBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes eyeBig{50%{transform:scale(1.15)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes wobble{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes nod{50%{transform:translateY(8px)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes listenBar{50%{transform:scaleY(.6)}}
@keyframes scan{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
@keyframes talk{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
@keyframes wave{from{transform:rotate(-10deg)}to{transform:rotate(-70deg)}}
@keyframes scratch{from{transform:rotate(10deg)}to{transform:rotate(40deg)}}
@keyframes pop{0%{transform:scale(.2)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important;animation-iteration-count:1!important}}
</style>
</head>
<body data-state="idle" data-listening="off">

<header>
  <h1>구구봇 <span>×</span> 곱셈 대결</h1>
  <div class="status-pill"><i></i><span id="statusText">대기 중</span></div>
</header>

<main>
  <div class="robot-wrap">
    <svg class="robot" viewBox="0 0 400 470" aria-label="구구봇 로봇">
      <!-- 톱니 -->
      <g transform="translate(46 70)"><circle class="gear g" r="26"/><circle class="gear-hub" r="9"/></g>
      <g transform="translate(356 96)"><circle class="gear g r" r="20"/><circle class="gear-hub" r="7"/></g>

      <!-- 팔 -->
      <g id="armL">
        <rect x="70" y="278" width="52" height="24" rx="12" fill="var(--metal-dark)"/>
        <rect x="56" y="282" width="24" height="96" rx="12" fill="var(--metal)" stroke="var(--metal-dark)" stroke-width="4"/>
        <circle cx="68" cy="386" r="16" fill="var(--accent)"/>
      </g>
      <g id="armR">
        <rect x="278" y="278" width="52" height="24" rx="12" fill="var(--metal-dark)"/>
        <rect x="320" y="282" width="24" height="96" rx="12" fill="var(--metal)" stroke="var(--metal-dark)" stroke-width="4"/>
        <circle cx="332" cy="386" r="16" fill="var(--accent)"/>
      </g>

      <!-- 몸통 -->
      <rect x="182" y="226" width="36" height="30" fill="var(--metal-dark)"/>
      <rect x="112" y="250" width="176" height="170" rx="32" fill="var(--metal)" stroke="var(--metal-dark)" stroke-width="5"/>
      <rect x="132" y="272" width="136" height="78" rx="14" fill="var(--screen)"/>
      <text id="chestText" x="200" y="322" text-anchor="middle" font-size="28">READY</text>
      <rect x="146" y="334" width="108" height="8" rx="4" fill="#24384a"/>
      <rect id="chestBar" x="146" y="334" width="0" height="8" rx="4"/>
      <circle cx="160" cy="382" r="11" fill="var(--accent)"/>
      <circle cx="200" cy="382" r="11" fill="#ffd23d"/>
      <circle cx="240" cy="382" r="11" fill="var(--glow)"/>
      <rect x="132" y="420" width="44" height="34" rx="10" fill="var(--metal-dark)"/>
      <rect x="224" y="420" width="44" height="34" rx="10" fill="var(--metal-dark)"/>

      <!-- 머리 -->
      <g id="head">
        <line x1="200" y1="62" x2="200" y2="26" stroke="var(--metal-dark)" stroke-width="7"/>
        <circle id="antennaLight" cx="200" cy="20" r="12"/>
        <rect class="ear" x="56" y="110" width="30" height="74" rx="12"/>
        <rect class="ear" x="314" y="110" width="30" height="74" rx="12"/>
        <rect x="80" y="60" width="240" height="172" rx="42" fill="var(--metal)" stroke="var(--metal-dark)" stroke-width="5"/>
        <rect x="104" y="84" width="192" height="124" rx="28" fill="var(--screen)"/>
        <!-- 눈 -->
        <g transform="translate(158 132)">
          <circle class="eye-normal g" r="17"/>
          <circle class="eye-think g" r="16"/>
          <path class="eye-happy" d="M-17 7 Q0 -16 17 7"/>
          <path class="eye-x" d="M-13 -13 L13 13 M13 -13 L-13 13"/>
        </g>
        <g transform="translate(242 132)">
          <circle class="eye-normal g" r="17"/>
          <circle class="eye-think g r" r="16"/>
          <path class="eye-happy" d="M-17 7 Q0 -16 17 7"/>
          <path class="eye-x" d="M-13 -13 L13 13 M13 -13 L-13 13"/>
        </g>
        <!-- 입 LED -->
        <g id="mouth">
          <rect class="bar" x="151" y="166" width="9" height="26" rx="3"/>
          <rect class="bar" x="165" y="166" width="9" height="26" rx="3"/>
          <rect class="bar" x="179" y="166" width="9" height="26" rx="3"/>
          <rect class="bar" x="193" y="166" width="9" height="26" rx="3"/>
          <rect class="bar" x="207" y="166" width="9" height="26" rx="3"/>
          <rect class="bar" x="221" y="166" width="9" height="26" rx="3"/>
          <rect class="bar" x="235" y="166" width="9" height="26" rx="3"/>
        </g>
      </g>
    </svg>
  </div>

  <section class="panel">
    <div class="bubble">
      <div class="label">문제</div>
      <div class="problem" id="problem"><span class="q">? × ? = ?</span></div>
    </div>
    <div class="heard" id="heard">들은 말: <b>-</b></div>
    <div class="msg" id="msg">스페이스바를 누르고 “구 곱하기 칠은?”이라고 말한 뒤, 스페이스바를 한 번 더 누르세요.</div>
  </section>
</main>

<div class="controls">
  <button id="micBtn" type="button">말하기 시작 (스페이스)</button>
  <form class="manual" id="manualForm">
    <input id="manualInput" type="text" placeholder="직접 입력: 9x7" autocomplete="off" aria-label="문제 직접 입력">
    <button type="submit">묻기</button>
  </form>
  <button id="fsBtn" type="button">전체 화면</button>
</div>

<details>
  <summary>로봇 설정 (목소리 · 고민 시간)</summary>
  <div class="settings">
    <label for="voiceSel">목소리</label><select id="voiceSel"></select>
    <label for="pitch">음높이 <span id="pitchV"></span></label><input id="pitch" type="range" min="0" max="1" step="0.05" value="0.1">
    <label for="rate">빠르기 <span id="rateV"></span></label><input id="rate" type="range" min="0.5" max="1.5" step="0.05" value="0.9">
    <label for="style">말투</label>
    <select id="style">
      <option value="chop" selected>로봇 끊어 말하기 (육. 십. 삼.)</option>
      <option value="normal">이어서 말하기</option>
    </select>
    <label for="think">고민 시간 <span id="thinkV"></span></label><input id="think" type="range" min="1" max="8" step="1" value="4">
    <label for="sfx">효과음</label><select id="sfx"><option value="on" selected>켜기</option><option value="off">끄기</option></select>
    <button type="button" id="testBtn">목소리 시험</button><span class="hint">스페이스바: 한 번 누르면 시작, 한 번 더 누르면 끝</span>
  </div>
</details>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const body = document.body;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  let rec = null, wantListen = false, busy = false, actx = null, beepTimer = null;

  // ---------- 상태 ----------
  const STATUS = {idle:'대기 중', listening:'듣는 중… (끝내려면 스페이스)', thinking:'계산 중…', answering:'정답 발표!', error:'다시 말해 주세요'};
  function setState(s){ body.dataset.state = s; $('statusText').textContent = STATUS[s]; }
  function setMsg(t, err){ $('msg').textContent = t; $('msg').className = 'msg' + (err ? ' err' : ''); }
  function chest(t, size){ const el = $('chestText'); el.textContent = t; el.setAttribute('font-size', size || 28); }

  // ---------- 효과음 ----------
  function audio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(actx && actx.state==='suspended') actx.resume(); return actx; }
  function tone(freq, dur, type='square', vol=0.05, when=0){
    if($('sfx').value==='off') return; const a = audio(); if(!a) return;
    const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  const startBeeps = () => { stopBeeps(); beepTimer = setInterval(() => tone(300 + Math.random()*1100, 0.06), 160); };
  const stopBeeps  = () => { clearInterval(beepTimer); beepTimer = null; };
  const ding  = () => { tone(880,0.12,'square',0.06); tone(1320,0.25,'square',0.06,0.12); };
  const buzz  = () => { tone(140,0.35,'sawtooth',0.06); };

  // ---------- 숫자 읽기 ----------
  const SINO = ['영','일','이','삼','사','오','육','칠','팔','구'];
  function numToKorean(n){
    if(n===0) return '영';
    const units = [[1000,'천'],[100,'백'],[10,'십']]; let s = '';
    for(const [v,u] of units){ const d = Math.floor(n/v)%10; if(d) s += (d===1 ? '' : SINO[d]) + u; }
    const one = n % 10; if(one) s += SINO[one];
    return s;
  }

  // ---------- 말 → 문제 풀이 ----------
  const TOKEN = '(\\d+|아홉|여덟|일곱|여섯|다섯|하나|넷|셋|둘|열|영|공|[일이삼사오육칠팔구십])';
  const VAL = {'아홉':9,'여덟':8,'일곱':7,'여섯':6,'다섯':5,'하나':1,'넷':4,'셋':3,'둘':2,'열':10,'영':0,'공':0,'십':10};
  SINO.forEach((c,i)=>{ if(i>0) VAL[c]=i; });
  const tokVal = t => /^\d+$/.test(t) ? parseInt(t,10) : VAL[t];

  function parseProblem(raw){
    let t = raw.replace(/[?？!.,~]/g,' ').replace(/\s+/g,' ').trim();
    const parts = t.split(/곱하기|곱셈|곱|[xX×*✕]/);
    if(parts.length >= 2){
      const L = parts[0].trim().match(new RegExp(TOKEN + '$'));
      const R = parts[1].trim().match(new RegExp('^' + TOKEN));
      if(L && R) return [tokVal(L[1]), tokVal(R[1])];
    }
    // 곱하기 없이 "9 7", "구칠", "97" 같은 경우
    const nums = t.match(/\d+/g) || [];
    if(nums.length === 1 && nums[0].length === 2) return [+nums[0][0], +nums[0][1]];
    if(nums.length >= 2) return [+nums[0], +nums[1]];
    const ks = t.replace(/\s/g,'').match(/^[일이삼사오육칠팔구]{2}/);
    if(ks) return [VAL[ks[0][0]], VAL[ks[0][1]]];
    return null;
  }

  // ---------- 음성 합성 ----------
  let voices = [];
  function loadVoices(){
    const all = speechSynthesis.getVoices();
    voices = all.filter(v => /^ko/i.test(v.lang));
    if(!voices.length) voices = all;
    const sel = $('voiceSel'), prev = sel.value; sel.innerHTML = '';
    voices.forEach((v,i) => { const o = document.createElement('option'); o.value = i; o.textContent = v.name + ' (' + v.lang + ')'; sel.appendChild(o); });
    if(prev && sel.options[prev]) sel.value = prev;
    else { const g = voices.findIndex(v => /google/i.test(v.name)); if(g >= 0) sel.value = g; }
  }
  if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }

  function sayOne(text){
    return new Promise(res => {
      if(!('speechSynthesis' in window)) return res();
      const u = new SpeechSynthesisUtterance(text);
      const v = voices[$('voiceSel').value]; if(v){ u.voice = v; u.lang = v.lang; } else u.lang = 'ko-KR';
      u.pitch = +$('pitch').value; u.rate = +$('rate').value;
      let done = false; const fin = () => { if(!done){ done = true; res(); } };
      u.onend = fin; u.onerror = fin;
      setTimeout(fin, 1500 + text.length * 450);   // onend가 안 오는 경우 대비
      speechSynthesis.speak(u);
    });
  }
  async function speak(lead, answerWord, tail){
    body.classList.add('speaking');
    speechSynthesis.cancel();
    if($('style').value === 'chop'){
      await sayOne(lead);
      for(const ch of answerWord){ tone(1500,0.03,'square',0.03); await sayOne(ch); await sleep(40); }
      await sayOne(tail);
    } else {
      await sayOne(lead + ' ' + answerWord + ' ' + tail);
    }
    body.classList.remove('speaking');
  }

  // ---------- 문제 풀기 ----------
  function showProblem(a, b, ans){
    $('problem').innerHTML = `${a} × ${b} = ` + (ans === undefined ? '<span class="q">?</span>' : `<span class="ans">${ans}</span>`);
  }
  async function solve(raw){
    if(busy) return;
    const p = parseProblem(raw);
    if(!p){
      busy = true;
      setState('error'); buzz(); chest('ERROR', 26);
      setMsg('숫자 두 개를 찾지 못했어요. “구 곱하기 칠은?”처럼 다시 물어보세요.', true);
      await sayOne('삐빅. 다시. 말해. 주세요.');
      busy = false; afterTurn(); return;
    }
    const [a, b] = p, ans = a * b;
    busy = true;
    showProblem(a, b); setMsg('구구봇이 고민하고 있어요…');
    setState('thinking'); chest('계산 중', 24); startBeeps();

    const ms = +$('think').value * 1000, bar = $('chestBar'), t0 = performance.now();
    await new Promise(res => {
      (function step(now){
        const k = Math.min(1, (now - t0) / ms); bar.setAttribute('width', 108 * k);
        if(k < 1) requestAnimationFrame(step); else res();
      })(t0);
    });

    stopBeeps(); ding(); bar.setAttribute('width', 0);
    showProblem(a, b, ans); chest(String(ans), 40);
    setState('answering'); setMsg(`정답은 ${ans}!`);
    await speak('계산 완료. 정답은', numToKorean(ans), '입니다.');
    await sleep(600);
    busy = false; afterTurn();
  }
  function afterTurn(){
    setState('idle'); chest('READY', 28);
    setMsg('스페이스바를 누르고 다음 문제를 말해 주세요.');
  }

  // ---------- 음성 인식: 스페이스(또는 버튼) 한 번 = 시작, 한 번 더 = 끝 ----------
  let micStream = null, recording = false, stopping = false, finals = [], interim = '';

  // 마이크를 처음 한 번만 열어 두고 계속 유지 → 같은 화면에서는 다시 묻지 않음
  async function ensureMic(){
    if(micStream && micStream.active) return true;
    try{
      micStream = await navigator.mediaDevices.getUserMedia({audio:true});
      return true;
    }catch(e){
      setMsg('마이크 사용이 막혀 있어요. 주소창 왼쪽 아이콘을 눌러 마이크를 "허용"으로 바꿔 주세요.', true);
      return false;
    }
  }
  function showHeard(t){
    $('heard').innerHTML = '들은 말: <b></b>';
    $('heard').querySelector('b').textContent = t.trim() || '-';
  }
  function makeRec(){
    const r = new SR();
    r.lang = 'ko-KR'; r.continuous = true; r.interimResults = true; r.maxAlternatives = 3;
    r.onresult = e => {
      interim = '';
      for(let i = e.resultIndex; i < e.results.length; i++){
        const res = e.results[i];
        if(res.isFinal){
          let pick = res[0].transcript;   // 후보 중 풀 수 있는 것 우선
          for(let j = 0; j < res.length; j++){ if(parseProblem(res[j].transcript)){ pick = res[j].transcript; break; } }
          finals.push(pick);
        } else interim += res[0].transcript;
      }
      showHeard(finals.join(' ') + ' ' + interim);
    };
    r.onerror = e => {
      if(e.error === 'not-allowed' || e.error === 'service-not-allowed')
        setMsg('마이크 사용이 막혀 있어요. 주소창 왼쪽 아이콘을 눌러 마이크를 "허용"으로 바꿔 주세요.', true);
      else if(e.error === 'network')
        setMsg('음성 인식은 인터넷 연결이 필요해요.', true);
    };
    r.onend = () => { if(recording){ recording = false; finishRecording(); } };
    return r;
  }
  function syncMicBtn(){
    body.dataset.listening = (recording && !stopping) ? 'on' : 'off';
    $('micBtn').textContent = recording ? '말하기 끝 (스페이스)' : '말하기 시작 (스페이스)';
  }
  function finishRecording(){
    stopping = false; syncMicBtn();
    const text = (finals.join(' ') + ' ' + interim).trim();
    if(!text){ setState('idle'); setMsg('아무 말도 듣지 못했어요. 스페이스바를 누르고 다시 말해 주세요.', true); return; }
    solve(text);
  }
  async function toggleMic(){
    audio();
    if(busy || stopping) return;
    if(!SR){ setMsg('이 브라우저는 음성 인식을 지원하지 않아요. 크롬(Chrome)이나 엣지(Edge)로 열어 주세요. 아래 칸에 직접 입력해도 돼요.', true); return; }
    if(!recording){
      if(!(await ensureMic())) return;
      if(!rec) rec = makeRec();
      finals = []; interim = ''; showHeard('');
      try{ rec.start(); }catch(_){}
      recording = true; syncMicBtn();
      setState('listening'); tone(660, 0.09, 'square', 0.05);
      setMsg('듣고 있어요. 다 말한 뒤 스페이스바를 한 번 더 누르세요.');
    } else {
      stopping = true; syncMicBtn(); tone(440, 0.09, 'square', 0.05);
      setMsg('잘 들었어요!');
      try{ rec.stop(); }catch(_){}
      // 브라우저가 끝 신호를 늦게 줄 때를 대비
      setTimeout(() => { if(recording){ recording = false; try{ rec.abort(); }catch(_){} finishRecording(); } }, 2000);
    }
  }

  // ---------- 이벤트 ----------
  $('micBtn').addEventListener('click', e => { e.currentTarget.blur(); toggleMic(); });
  $('manualForm').addEventListener('submit', e => {
    e.preventDefault(); audio();
    const v = $('manualInput').value.trim(); if(!v) return;
    $('heard').innerHTML = '입력: <b></b>'; $('heard').querySelector('b').textContent = v;
    $('manualInput').value = ''; solve(v);
  });
  // 스페이스바: 입력 칸에 글을 쓰는 중이 아니면 언제나 말하기 시작/끝
  const typing = () => ['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName);
  document.addEventListener('keydown', e => {
    if(e.code !== 'Space' || typing()) return;
    e.preventDefault();            // 버튼·접기 메뉴가 눌리지 않게
    if(e.repeat) return;           // 꾹 누르고 있어도 한 번만
    toggleMic();
  });
  document.addEventListener('keyup', e => { if(e.code === 'Space' && !typing()) e.preventDefault(); });
  $('fsBtn').addEventListener('click', () => {
    if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
    else document.documentElement.requestFullscreen().catch(()=>{});
  });
  $('testBtn').addEventListener('click', () => { audio(); speak('삐빅. 나는 구구봇.', '육십삼', '입니다.'); });
  [['pitch','pitchV'],['rate','rateV'],['think','thinkV']].forEach(([i,o]) => {
    const f = () => { $(o).textContent = $(i).value + (i === 'think' ? '초' : ''); };
    $(i).addEventListener('input', f); f();
  });

  // 시작 화면 예시
  showProblem(9, 7);

  // 개발용 자가 점검
  window.__test = { parseProblem, numToKorean };
})();
</script>
